[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "use-first-banana"
version = "0.1.0"
description = "Visible-deterioration prioritization for bananas"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "Pillow>=10.0",
  "scikit-learn>=1.4",
]

[project.scripts]
use-first = "usefirst.cli:main"

[tool.setuptools.packages.find]
include = ["usefirst*"]

